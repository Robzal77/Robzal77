<text x="86" y="370" font-size="16" fill="#ffffff">Evidence → AI reasoning →</text>
<text x="86" y="395" font-size="16" fill="#ffffff">risk-based human control</text>

<rect x="330" y="300" width="250" height="120" rx="16" fill="#171f29" stroke="#3a4653"/>
<text x="352" y="338" font-size="18" font-weight="700" fill="#7ee0b8">NAGRIK RESOLVE</text>
