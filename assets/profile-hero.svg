<text x="352" y="395" font-size="16" fill="#ffffff">journeys and trust by design</text>

<rect x="596" y="300" width="250" height="120" rx="16" fill="#171f29" stroke="#3a4653"/>
<text x="618" y="338" font-size="18" font-weight="700" fill="#69a9ff">ENTERPRISE BI ENGINEERING</text>
<text x="618" y="370" font-size="16" fill="#ffffff">PBIP · TMDL · Git · health</text>
<text x="618" y="395" font-size="16" fill="#ffffff">scoring · governance</text>

<rect x="862" y="300" width="250" height="120" rx="16" fill="#171f29" stroke="#3a4653"/>
