<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Rabindra Rizal — AI, Analytics and Product Leadership</title>
<desc id="desc">Profile hero showing flagship systems and measurable enterprise outcomes.</desc>
<rect width="1200" height="620" rx="28" fill="#0b0f14"/>
<rect x="20" y="20" width="1160" height="580" rx="24" fill="#111821" stroke="#2a3440"/>
<text x="64" y="92" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#ffcc33">AI × ANALYTICS × AUTOMATION × PRODUCT</text>
<text x="64" y="152" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#ffffff">I build intelligent systems</text>
<text x="64" y="202" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#ffffff">behind enterprise decisions.</text>
<text x="64" y="250" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#aeb9c6">From ambiguous business problems to governed products, AI workflows and measurable outcomes.</text>

